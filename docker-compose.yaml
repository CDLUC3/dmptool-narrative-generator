# NOTE::
# The services, settings and environment setup in this compose file is for DEVELOPMENT ONLY!
#
# It is intended to run the Apollo server in an "offline" mode. All data will be mocked.
#
networks:
  dmptool-apollo-server_dmptool-network:
    external: true

services:
  narrative:
    container_name: narrative-generator
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4030:4030"
    networks:
      - dmptool-apollo-server_dmptool-network
    expose:
      - 4030
    env_file:
      - .env
    environment:
      - "AWS_ACCESS_KEY_ID=DUMMYIDEXAMPLE"
      - "AWS_SECRET_ACCESS_KEY=DUMMYEXAMPLEKEY"
      - "REGION=us-west-2"
      - "ENV=dev"
      - "NODE_ENV=development"
      - "PORT=4030"

      - "RDS_HOST=apollo-mysql"
      - "RDS_PORT=3306"
      - "RDS_DATABASE=dmptool"

      - "DYNAMODB_ENDPOINT=http://localstack:4566"
      - "DYNAMODB_TABLE_NAME=localDMPTable"
      - "MAX_ATTEMPTS=3"

      - "CACHE_HOST=apollo-redis"
      - "CACHE_PORT=6379"
      - "CACHE_CONNECT_TIMEOUT=10000"

      - "EZID_BASE_URL=https://doi.org"

      - "TOKEN_ISSUER=http://auth:4646"

      # Using the Apollo server network's LocalStack endpoint
      - "SSM_ENDPOINT=http://localstack:4566"
    volumes:
      - ".:/app"
      # Tells Docker NOT to overwrite node_modules. It just worked with ts-node-dev because that is written in 100% javascript. When our Mac's node_modules folder overwrote our Docker container's folder in the past,
      # the Linux container didn't care. It could read and execute the pure JavaScript files from your Mac fine because Node.js translates JavaScript the same way on any operating system. tsx is built
      # on top of a tool called esbuild, which is written in Go and compiled into raw, native machine code to make it ultra fast. A binary compiled
      # for macOS (Darwin ARM64) is built out of specific instructions meant exclusively for Apple Silicon chips and Apple's kernel. A binary compiled for
      # Linux (Linux ARM64) uses completyely different machine instructions mean for a Linux kernel.
      - /app/node_modules
